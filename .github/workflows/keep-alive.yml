name: Keep Supabase Alive

on:
  schedule:
    # Ogni 12 ore - margine di sicurezza molto ampio rispetto ai 7 giorni di timeout
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Esegui Ping su Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u

          echo "=== Keep-Alive Ping - $(date) ==="

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_URL o SUPABASE_ANON_KEY non configurati nei secrets!"
            exit 1
          fi

          echo "URL: $SUPABASE_URL"

          endpoint="${SUPABASE_URL%/}/rest/v1/products?select=id&limit=1"
          response_file="$(mktemp)"

          http_code=$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 4 \
            --retry-delay 10 \
            --retry-max-time 180 \
            --retry-all-errors \
            --request GET "$endpoint" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Cache-Control: no-cache")

          curl_exit=$?

          echo "HTTP status: $http_code"
          echo ""
          echo "=== Risposta da Supabase ==="
          cat "$response_file"
          echo ""

          if [ "$curl_exit" -ne 0 ]; then
            echo "✗ Errore nel ping: exit code $curl_exit"
            exit 1
          fi

          case "$http_code" in
            2*)
              echo "✓ Keep-alive ping eseguito con successo"
              ;;
            *)
              echo "✗ Supabase ha restituito HTTP $http_code"
              exit 1
              ;;
          esac
