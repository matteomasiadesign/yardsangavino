<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yard | Menù</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #39FF14;
            --accent-dim: rgba(57, 255, 20, 0.15);
            --text: #f5f5f7;
            --text-muted: #a1a1a6;
            --glow: 0 0 20px rgba(57, 255, 20, 0.25);
            --collapse-duration: 0.4s;
            --ease-spring: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(ellipse 800px 600px at 0% 0%, rgba(57, 255, 20, 0.05), transparent 70%),
                radial-gradient(ellipse 800px 600px at 100% 100%, rgba(57, 255, 20, 0.05), transparent 70%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; 
            padding: 24px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            line-height: 1.5;
        }

        header { 
            margin: 20px 0 40px; 
            text-align: center; 
            width: 100%;
            animation: fadeInDown 0.8s var(--ease-spring);
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
        }

        .logo-img {
            max-width: 180px;
            max-height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }

        @media (max-width: 560px) {
            .logo-img { max-width: 200px; max-height: 90px; }
        }

        h1 { 
            font-weight: 700; 
            font-size: 2.2rem; 
            letter-spacing: 2px; 
            color: var(--text); 
            margin: 10px 0; 
            text-shadow: var(--glow); 
        }

        .menu-wrapper { 
            width: 100%; 
            max-width: 540px; 
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color); 
            border-radius: 24px; 
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s var(--ease-spring);
            animation: fadeInUp 0.5s var(--ease-spring) both;
            scroll-margin-top: 20px;
        }
        
        /* Ritardo sequenziale per le animazioni d'ingresso (le prime 10 categorie) */
        .category:nth-child(1) { animation-delay: 0.1s; }
        .category:nth-child(2) { animation-delay: 0.15s; }
        .category:nth-child(3) { animation-delay: 0.2s; }
        .category:nth-child(4) { animation-delay: 0.25s; }
        .category:nth-child(5) { animation-delay: 0.3s; }
        
        .cat-header { 
            padding: 22px 24px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            color: var(--text); 
            transition: background 0.3s, color 0.3s;
            position: sticky;
            top: 0;
            z-index: 2;
            background: rgba(15, 15, 15, 0.6);
        }

        .category:has(.items.active) {
            border-color: var(--accent-dim);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 0 0 1px var(--accent-dim);
            background: rgba(255, 255, 255, 0.04);
        }

        .category:has(.items.active) .cat-header {
            color: var(--accent);
            background: rgba(20, 20, 20, 0.9);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        .cat-header:hover { background: var(--glass-hover); }

        .chevron {
            width: 20px;
            height: 20px;
            transition: transform var(--collapse-duration) var(--ease-spring);
            opacity: 0.7;
        }

        .category:has(.items.active) .chevron {
            transform: rotate(180deg);
            opacity: 1;
        }

        .items { 
            padding: 0 24px; 
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height var(--collapse-duration) var(--ease-spring), 
                        opacity 0.3s ease, 
                        padding var(--collapse-duration) var(--ease-spring);
        }
        
        .items.active { 
            padding: 0 24px 24px 24px;
            opacity: 1;
        }
        
        .row { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end;
            padding: 16px 0; 
            font-size: 0.95rem; 
            border-bottom: 1px solid rgba(255,255,255,0.06); 
        }
        .row:last-child { border-bottom: none; }
        
        .prod-name {
            font-weight: 400;
            color: var(--text);
            padding-right: 15px;
            max-width: 75%;
        }

        .price { 
            font-weight: 600; 
            color: var(--accent); 
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            white-space: nowrap;
        }

        .lang-notice {
            display: none;
            text-align: center;
            font-size: 0.85rem;
            color: #ff9f0a;
            background: rgba(255, 159, 10, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 159, 10, 0.2);
            border-radius: 16px;
            padding: 12px 16px;
            margin: 0 0 20px;
            width: 100%;
            max-width: 540px;
        }

        .loader { 
            border: 3px solid rgba(255,255,255,0.05); 
            border-top: 3px solid var(--accent); 
            border-radius: 50%; 
            width: 36px; 
            height: 36px; 
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; 
            margin: 40px auto 20px; 
            box-shadow: var(--glow);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .error-msg { 
            color: #ff453a; 
            text-align: center; 
            padding: 24px; 
            background: rgba(255,69,58,0.1); 
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            border: 1px solid rgba(255,69,58,0.2); 
            margin-top: 20px;
        }

        .lang-fab {
            position: fixed;
            right: 24px;
            bottom: calc(36px + env(safe-area-inset-bottom, 0px));
            z-index: 50;
        }
        .lang-fab.loading { opacity: 0.5; pointer-events: none; filter: grayscale(100%); }

        @media (min-width: 600px) {
            .lang-fab {
                right: calc(50vw - 270px - 24px);
                bottom: 36px;
            }
        }

        .lang-fab-main {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 3px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--accent-dim);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: transform 0.3s var(--ease-spring), box-shadow 0.3s ease;
        }
        .lang-fab-main:hover {
            transform: scale(1.05);
            box-shadow: var(--glow), 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .lang-fan {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 60px;
            height: 60px;
            pointer-events: none;
        }

        .lang-fan-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            padding: 2px;
            background: rgba(25, 25, 25, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            opacity: 0;
            transform: translate(0, 0) scale(0.4);
            transition: transform 0.4s var(--ease-spring), opacity 0.3s ease, border-color 0.2s ease;
        }
        .lang-fan-btn:hover { border-color: var(--accent); transform: scale(1.1) !important; }

        .lang-fab.open .lang-fan-btn { opacity: 1; pointer-events: auto; }
        .lang-fab.open .lang-fan-btn:nth-child(1) { transform: translate(-4px, -76px) scale(1); transition-delay: 0ms; }
        .lang-fab.open .lang-fan-btn:nth-child(2) { transform: translate(-52px, -60px) scale(1); transition-delay: 40ms; }
        .lang-fab.open .lang-fan-btn:nth-child(3) { transform: translate(-76px, -16px) scale(1); transition-delay: 80ms; }
        .lang-fab.open .lang-fan-btn:nth-child(4) { transform: translate(-80px, 32px) scale(1); transition-delay: 120ms; }

        .flag-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .flag-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
        }
        
        footer { 
            margin-top: auto; 
            padding-top: 60px;
            padding-bottom: 30px;
            text-align: center; 
            width: 100%;
            animation: fadeIn 1s ease 0.5s both;
        }
        footer p { margin: 5px 0; color: var(--text-muted); font-size: 0.85rem; }
        .insta-link { 
            color: var(--text); 
            text-decoration: none; 
            font-weight: 600; 
            display: inline-flex; 
            align-items: center;
            gap: 6px;
            margin-top: 15px; 
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            transition: all 0.3s ease;
        }
        .insta-link:hover {
            background: rgba(255,255,255,0.1);
            color: var(--accent);
            border-color: var(--accent-dim);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.webp" class="logo-img" alt="YARD Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<h1>YARD</h1>';">
        </div>
    </header>

    <div class="lang-notice" id="lang-notice"></div>

    <div class="menu-wrapper" id="menu-container">
        <!-- Loader iniziale -->
        <div id="loader-wrapper">
            <div class="loader"></div>
            <p style="text-align:center; color: var(--text-muted); font-size: 14px; margin-top: 15px;" id="loader-text">Caricamento menù...</p>
        </div>
    </div>

    <div class="lang-fab" id="lang-fab">
        <button class="lang-fab-main" id="lang-fab-main" onclick="toggleLangFan()" aria-label="Cambia lingua" aria-expanded="false"></button>
        <div class="lang-fan" id="lang-fan"></div>
    </div>

    <footer>
        <p><strong>YARD</strong> | Chiosco del parco</p>
        <p>Parco di San Gavino, Porto Torres (SS)</p>
        <a href="https://www.instagram.com/yardsangavino/" class="insta-link" target="_blank">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            Instagram
        </a>
        <p style="margin-top:25px; opacity: 0.4; font-size: 0.75rem;">Designed by Matteo Masia</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://germswzsfsxxlawqxsgt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_xXjGt3cuynDUHnlq846e4Q_dk-xwcMa';
        
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cats = [];
        let prods = [];
        let currentLang = 'it';
        try { currentLang = localStorage.getItem('yard_lang') || 'it'; } catch (e) { }
        let nameOverrides = { categories: {}, products: {} };

        const LANGS = [
            { code: 'it', flag: 'it', label: 'Italiano' },
            { code: 'en', flag: 'gb', label: 'English' },
            { code: 'es', flag: 'es', label: 'Español' },
            { code: 'fr', flag: 'fr', label: 'Français' },
            { code: 'de', flag: 'de', label: 'Deutsch' }
        ];

        function flagUrl(flagCode) {
            return `https://flagcdn.com/${flagCode}.svg`;
        }

        function renderLangFab() {
            const main = document.getElementById('lang-fab-main');
            const fan = document.getElementById('lang-fan');
            if (!main || !fan) return;

            const current = LANGS.find(l => l.code === currentLang) || LANGS[0];
            main.innerHTML = `<img class="flag-img" src="${flagUrl(current.flag)}" alt="${current.label}" onerror="this.outerHTML='&lt;span class=&quot;flag-fallback&quot;&gt;${current.code.toUpperCase()}&lt;/span&gt;'">`;

            const others = LANGS.filter(l => l.code !== currentLang);
            fan.innerHTML = others.map(l =>
                `<button class="lang-fan-btn" onclick="selectLanguage('${l.code}')" aria-label="${l.label}">
                    <img class="flag-img" src="${flagUrl(l.flag)}" alt="${l.label}" onerror="this.outerHTML='&lt;span class=&quot;flag-fallback&quot;&gt;${l.code.toUpperCase()}&lt;/span&gt;'">
                </button>`
            ).join('');
        }

        window.toggleLangFan = function() {
            const fab = document.getElementById('lang-fab');
            const isOpen = fab.classList.toggle('open');
            document.getElementById('lang-fab-main').setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        };

        function closeLangFan() {
            const fab = document.getElementById('lang-fab');
            fab.classList.remove('open');
            document.getElementById('lang-fab-main').setAttribute('aria-expanded', 'false');
        }

        document.addEventListener('click', (e) => {
            const fab = document.getElementById('lang-fab');
            if (fab && fab.classList.contains('open') && !fab.contains(e.target)) {
                closeLangFan();
            }
        });

        window.selectLanguage = function(lang) {
            closeLangFan();
            setLanguage(lang);
        };

        async function loadMenu() {
            const container = document.getElementById('menu-container');
            const loader = document.getElementById('loader-wrapper');
            const loaderText = document.getElementById('loader-text');
            
            try {
                loaderText.textContent = "Caricamento categorie...";
                const { data: catData, error: catErr } = await sb
                    .from('categories')
                    .select('*')
                    .eq('is_visible', true)
                    .order('order_index');

                if (catErr) throw new Error("Errore Categorie: " + catErr.message);

                loaderText.textContent = "Caricamento prodotti...";
                const { data: prodData, error: prodErr } = await sb
                    .from('products')
                    .select('*')
                    .eq('is_visible', true)
                    .order('order_index');

                if (prodErr) throw new Error("Errore Prodotti: " + prodErr.message);

                cats = catData || [];
                prods = prodData || [];
                loader.style.display = 'none';
                renderLangFab();

                if (currentLang !== 'it') {
                    await applyLanguage(currentLang);
                } else {
                    renderMenu();
                }

            } catch (error) {
                console.error("Errore in loadMenu:", error);
                if (loader) loader.style.display = 'none';
                container.innerHTML = `
                    <div class="error-msg">
                        <strong>Ops! Impossibile caricare il menù.</strong><br>
                        <small style="opacity:0.8; display:block; margin-top:10px;">${error.message}</small>
                    </div>`;
            }
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');

            if (!cats || cats.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 40px 20px;">Nessuna categoria visibile al momento.</p>';
                return;
            }

            let menuHTML = '';
            
            // Icona freccia riutilizzabile
            const chevronIcon = `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

            cats.forEach(cat => {
                const catProducts = prods ? prods.filter(p => p.category_id === cat.id) : [];
                if (catProducts.length === 0) return;

                const catName = currentLang !== 'it' && nameOverrides.categories[cat.id]
                    ? nameOverrides.categories[cat.id]
                    : cat.name;

                let itemsHTML = catProducts.map(p => {
                    const prodName = currentLang !== 'it' && nameOverrides.products[p.id]
                        ? nameOverrides.products[p.id]
                        : p.name;
                    return `
                        <div class="row">
                            <span class="prod-name">${prodName}</span>
                            <span class="price">€${parseFloat(p.price).toFixed(2)}</span>
                        </div>
                    `;
                }).join('');

                menuHTML += `
                    <div class="category">
                        <div class="cat-header" onclick="toggleCategory(this)">
                            ${catName.toUpperCase()} 
                            ${chevronIcon}
                        </div>
                        <div class="items">
                            ${itemsHTML}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = menuHTML || '<p style="text-align:center; color: var(--text-muted);">Nessun prodotto visibile al momento.</p>';
        }

        function showLangNotice(message) {
            const el = document.getElementById('lang-notice');
            if (!el) return;
            if (!message) { el.style.display = 'none'; el.textContent = ''; return; }
            el.textContent = message;
            el.style.display = 'block';
        }

        async function applyLanguage(lang) {
            if (lang === 'it') {
                currentLang = 'it';
                nameOverrides = { categories: {}, products: {} };
                renderLangFab();
                renderMenu();
                showLangNotice(null);
                return;
            }

            const fabEl = document.getElementById('lang-fab');
            if (fabEl) fabEl.classList.add('loading');

            try {
                const res = await fetch(`/api/translate-menu?lang=${lang}`);
                if (!res.ok) throw new Error('Servizio traduzione non disponibile');
                const data = await res.json();

                currentLang = lang;
                nameOverrides = { categories: data.categories || {}, products: data.products || {} };
                renderLangFab();
                renderMenu();
                showLangNotice(data.partial ? 'Alcune voci verranno tradotte a breve.' : null);
            } catch (err) {
                console.error('Errore traduzione:', err);
                currentLang = 'it';
                nameOverrides = { categories: {}, products: {} };
                renderLangFab();
                renderMenu();
                showLangNotice('Traduzione non disponibile, mostro il menù in italiano.');
            } finally {
                if (fabEl) fabEl.classList.remove('loading');
            }
        }

        window.setLanguage = function(lang) {
            if (lang === currentLang) return;
            try { localStorage.setItem('yard_lang', lang); } catch (e) { }
            applyLanguage(lang);
        };

        window.toggleCategory = function(element) {
            const itemsContainer = element.nextElementSibling;
            const isActive = itemsContainer.classList.contains('active');
            const allCategories = Array.from(document.querySelectorAll('.category'));
            const clickedIndex = allCategories.indexOf(element.parentElement);

            const durationStr = getComputedStyle(document.documentElement).getPropertyValue('--collapse-duration').trim();
            const collapseDuration = parseFloat(durationStr) * 1000 || 400;

            let mustWaitForCloseAbove = false;

            document.querySelectorAll('.items.active').forEach(otherItems => {
                if (otherItems === itemsContainer) return;

                const otherCategoryDiv = otherItems.closest('.category');
                const otherIndex = allCategories.indexOf(otherCategoryDiv);
                if (otherIndex < clickedIndex) mustWaitForCloseAbove = true;

                otherItems.style.maxHeight = otherItems.scrollHeight + 'px';
                void otherItems.offsetHeight; 
                otherItems.style.maxHeight = '0px';
                otherItems.classList.remove('active');
            });

            if (isActive) {
                itemsContainer.style.maxHeight = '0px';
                itemsContainer.classList.remove('active');
                return;
            }

            itemsContainer.classList.add('active');
            itemsContainer.style.maxHeight = itemsContainer.scrollHeight + 'px';

            const checkAndScroll = () => {
                const rect = element.getBoundingClientRect();
                // Scrolla solo se il titolo della categoria finisce fuori dallo schermo in alto 
                // (es: a causa della chiusura di una categoria superiore) o è troppo nascosto in basso
                if (rect.top < 10 || rect.bottom > (window.innerHeight || document.documentElement.clientHeight) - 20) {
                    element.parentElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            if (mustWaitForCloseAbove) {
                // Aspettiamo che l'animazione di chiusura dell'elemento sopra finisca prima di ricalcolare
                setTimeout(checkAndScroll, collapseDuration + 10);
            } else {
                // L'elemento si apre verso il basso, controlliamo subito se esce dallo schermo
                setTimeout(checkAndScroll, 50);
            }
        };

        loadMenu();
    </script>
</body>
</html>
